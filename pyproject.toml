[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pufguard"
version = "0.2.0"
description = "Explainable privacy and linkability auditing for public-use tabular data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "clingo>=5.8,<6",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
